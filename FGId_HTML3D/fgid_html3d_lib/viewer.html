              const count = visible.reduce((sum, scan) => sum + scan.count, 0);
              const indices = new Uint32Array(count);
              let offset = 0;
              for (const scan of visible) {
                for (let i = 0; i < scan.count; i++) indices[offset++] = scan.start + i;
              }
              geometry.setIndex(new THREE.BufferAttribute(indices, 1));
            }
            pointCloud.userData.scanKey = key;
          }
          material.needsUpdate = true;
        }

        function configureCloudScenes() {
          if (!pointCloud || !FGID_META.cloud) return;
          const crop = {
            lower: {value: new THREE.Vector3()},
            upper: {value: new THREE.Vector3()}
          };
          pointCloud.userData.crop = crop;
          pointCloud.material.onBeforeCompile = shader => {
            shader.uniforms.fgidCropLo = crop.lower;
            shader.uniforms.fgidCropHi = crop.upper;
            shader.vertexShader = 'varying vec3 fgidLocalPoint;\n' + shader.vertexShader;
            shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
              '#include <begin_vertex>\nfgidLocalPoint = vec3(position.x, -position.z, position.y);');
            shader.fragmentShader =
              'varying vec3 fgidLocalPoint; uniform vec3 fgidCropLo; uniform vec3 fgidCropHi;\n' +
              shader.fragmentShader;
            shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>',
              '#include <clipping_planes_fragment>\nif (any(lessThan(fgidLocalPoint, fgidCropLo)) || any(greaterThan(fgidLocalPoint, fgidCropHi))) discard;');
          };
          pointCloud.material.customProgramCacheKey = () => 'fgid-scene-crop-v1';
          document.getElementById('plyTransformPanel').style.display = 'none';
          applyPointCloudScene(FGID_META.cloud.current);
        }

        function applyExtraPointCloudTransform() {
          if (!pointCloud) return;

          const tx = Number(document.getElementById('plyTx').value) || 0;
          const ty = Number(document.getElementById('plyTy').value) || 0;
          const tz = Number(document.getElementById('plyTz').value) || 0;
          const rx = THREE.MathUtils.degToRad(Number(document.getElementById('plyRx').value) || 0);
          const ry = THREE.MathUtils.degToRad(Number(document.getElementById('plyRy').value) || 0);
          const rz = THREE.MathUtils.degToRad(Number(document.getElementById('plyRz').value) || 0);
          const sc = Math.max(0.000001, Number(document.getElementById('plyScale').value) || 1);

          // Inputs use SketchUp coordinates; convert to Three coordinates.
          pointCloud.position.set(tx, tz, -ty);
          pointCloud.rotation.set(rx, rz, -ry, 'XYZ');
          pointCloud.scale.setScalar(sc);
          pointCloud.updateMatrixWorld(true);
        }

        function updatePointCloudButton() {
          const button = document.getElementById('btnPointCloud');
          if (!pointCloud) {
            button.style.display = 'none';
            return;
          }
          button.classList.toggle('active', pointCloudVisible);
          button.textContent = pointCloudVisible ? 'Point cloud ON' : 'Point cloud OFF';
        }

        function setPointCloudVisible(visible) {
          pointCloudVisible = !!visible;
          if (pointCloud) pointCloud.visible = pointCloudVisible;
          updatePointCloudButton();
        }

        function addLooseEdges() {
          if (!Array.isArray(LOOSE_EDGE_POSITIONS) || LOOSE_EDGE_POSITIONS.length < 6) return;

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(LOOSE_EDGE_POSITIONS, 3)
          );
          geometry.computeBoundingSphere();

          const material = new THREE.LineBasicMaterial({
            color: darkMode ? 0xffffff : 0x111111,
            transparent: true,
            opacity: 0.85,
            depthTest: true
          });

          const lines = new THREE.LineSegments(geometry, material);
          lines.name = '__loose_edges__';
          lines.renderOrder = 3;
          scene.add(lines);
          edgeObjects.push(lines);
        }

        function addEdges(obj) {
          obj.traverse(child => {
            if (!child.isMesh || !child.geometry) return;
            // Never generate outline geometry for FGId_Cotes_3D objects.
            if (isSpecialCotesObject(child)) return;
            const edgesGeo = new THREE.EdgesGeometry(child.geometry, 30);
            const edgesMat = new THREE.LineBasicMaterial({ color:0x111111, transparent:true, opacity:0.55, depthTest:true });
            const edges = new THREE.LineSegments(edgesGeo, edgesMat);
            edges.name = '__edges_30deg__';
            edges.renderOrder = 2;
            child.add(edges);
            edgeObjects.push(edges);
          });
        }

        let renderMode = FGID_META.initialRenderMode || 'textures';
        document.getElementById('renderMode').value = renderMode;
        const renderSources = new WeakMap();
        const renderVariants = new Map();
        const textureAverages = new WeakMap();

        function averageTextureColor(texture) {
          const image = texture?.image;
          if (!image || !(image.width > 0) || !(image.height > 0)) return null;
          if (textureAverages.has(image)) return textureAverages.get(image);
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 8;
          const context = canvas.getContext('2d', {willReadFrequently:true});
          context.drawImage(image, 0, 0, 8, 8);
          const pixels = context.getImageData(0, 0, 8, 8).data;
          let red = 0, green = 0, blue = 0, weight = 0;
          for (let i = 0; i < pixels.length; i += 4) {
            const alpha = pixels[i+3] / 255;
            red += pixels[i] * alpha;
            green += pixels[i+1] * alpha;
            blue += pixels[i+2] * alpha;
            weight += alpha;
          }
          const color = weight ? new THREE.Color().setRGB(
            red / weight / 255, green / weight / 255, blue / weight / 255,
            THREE.SRGBColorSpace) : new THREE.Color(1,1,1);
          textureAverages.set(image, color);
          return color;
        }

        function clearRenderVariants() {
          for (const variants of renderVariants.values()) {
            for (const material of variants.values()) material.dispose();
          }
          renderVariants.clear();
        }

        function renderMaterial(source) {
          if (renderMode === 'textures') return source;
          if (!renderVariants.has(source)) renderVariants.set(source, new Map());
          const variants = renderVariants.get(source);
          let material = variants.get(renderMode);
          if (!material) {
            if (renderMode === 'normals') {
              material = new THREE.MeshNormalMaterial();
            } else if (renderMode === 'hiddenline' || renderMode === 'wireframe') {
              material = new THREE.MeshBasicMaterial();
              material.wireframe = renderMode === 'wireframe';
            } else if (renderMode === 'clay') {
              material = new THREE.MeshStandardMaterial({
                color:0x9c948a, metalness:0, roughness:1, toneMapped:false
              });
            } else if (renderMode === 'monochrome') {
              material = new IngeTrazoMatteMaterial({
                color:0xd4d7dc, metalness:0, roughness:1, toneMapped:false
              });
            } else {
              material = source.clone();
              for (const key of ['map','normalMap','bumpMap','roughnessMap','metalnessMap','aoMap','emissiveMap']) {
                if (key in material) material[key] = null;
              }
            }
            variants.set(renderMode, material);
          }
          if (renderMode === 'colors' || renderMode === 'xray') {
            material.color.copy(source.color);
            const average = averageTextureColor(source.map);
            if (average) material.color.multiply(average);
          } else if (renderMode === 'hiddenline') {
            material.color.setHex(darkMode ? 0x17202e : 0xffffff);
          } else if (renderMode === 'wireframe') {
            material.color.setHex(darkMode ? 0xe7edf4 : 0x202020);
          }
          const opacity = renderMode === 'xray' ? source.opacity * 0.25 : source.opacity;
          const transparent = opacity < 1 || source.transparent;
          if (material.transparent !== transparent || material.side !== source.side ||
              material.clippingPlanes !== source.clippingPlanes) material.needsUpdate = true;
          material.side = source.side;
          material.visible = source.visible;
          material.opacity = opacity;
          material.transparent = transparent;
          material.depthTest = renderMode !== 'wireframe';
          material.depthWrite = renderMode === 'xray' || renderMode === 'wireframe' ? false : source.depthWrite;
          material.clippingPlanes = source.clippingPlanes;
          material.clipIntersection = source.clipIntersection;
          material.polygonOffset = source.polygonOffset;
          material.polygonOffsetFactor = source.polygonOffsetFactor;
          material.polygonOffsetUnits = source.polygonOffsetUnits;
          return material;
        }

        function applyRenderEdges() {
          const hiddenLine = renderMode === 'hiddenline';
          const wireframe = renderMode === 'wireframe';
          const visible = !wireframe && (hiddenLine || edgesVisible);
          for (const edge of edgeObjects) {
            edge.visible = visible;
            edge.material.depthTest = renderMode !== 'xray';
            edge.material.color.setHex(darkMode ? 0xffffff : 0x111111);
            edge.material.opacity = hiddenLine ? 1 : 0.55;
          }
          const button = document.getElementById('btnEdges');
          button.disabled = hiddenLine || wireframe;
          button.classList.toggle('active', visible);
          button.textContent = visible ? 'Edges 30° ON' : 'Edges 30° OFF';
        }

        function applyRenderMode() {
          if (!root) return;
          root.traverse(object => {
            if (!object.isMesh || isSpecialCotesObject(object)) return;
            if (!renderSources.has(object)) renderSources.set(object, object.material);
            const source = renderSources.get(object);
            object.material = Array.isArray(source) ? source.map(renderMaterial) : renderMaterial(source);
          });
          applyRenderEdges();
          annotationOcclusionDirty = true;
        }

        function setEdgesVisible(v) {
          edgesVisible = v;
          applyRenderEdges();
        }

        function getBox() {
          const box = new THREE.Box3();

          if (root) {
            box.expandByObject(root);
          }

          // The point cloud participates in Fit / default camera even when hidden.
          if (pointCloud && pointCloud.geometry) {
            pointCloud.updateWorldMatrix(true, false);
            if (!pointCloud.geometry.boundingBox) pointCloud.geometry.computeBoundingBox();
            const cloudBox = pointCloud.geometry.boundingBox.clone().applyMatrix4(pointCloud.matrixWorld);
            box.union(cloudBox);
          }

          if (!isFinite(box.min.x) || box.isEmpty()) {
            box.setFromCenterAndSize(new THREE.Vector3(), new THREE.Vector3(10,10,10));
          }
          return box;
        }

        function getModelMetrics() {
          const box = getBox();
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const sphere = box.getBoundingSphere(new THREE.Sphere());
          const radius = Math.max(sphere.radius, Math.max(size.x, size.y, size.z) * 0.5, 1);
          return { box, center, size, radius };
        }

        function updateClipFromModel() {
          const m = getModelMetrics();
          // Keep the depth range close to the actual model size. This improves
          // precision for thin / closely spaced faces while retaining enough room
          // for normal orbit and zoom operations.
          camera.near = Math.max(m.radius / 1000, 0.005);
          camera.far = Math.max(m.radius * 100, 100);
          camera.updateProjectionMatrix();
        }

        function replaceCamera(newCamera, position, target) {
          newCamera.position.copy(position);
          newCamera.up.copy(camera.up);
          camera = newCamera;
          controls.object = camera;
          controls.target.copy(target);
          camera.lookAt(target);
          camera.updateProjectionMatrix();
          controls.update();
        }

        function ensurePerspectiveCamera(fov = 45) {
          const aspect = window.innerWidth / window.innerHeight;
          if (!camera.isPerspectiveCamera) {
            const position = camera.position.clone();
            const target = controls.target.clone();
            replaceCamera(
              new THREE.PerspectiveCamera(fov, aspect, 0.01, 1000000),
              position,
              target
            );
          }
          camera.fov = fov;
          camera.aspect = aspect;
          camera.updateProjectionMatrix();
        }

        function ensureOrthographicCamera(radius = 10) {
          const aspect = window.innerWidth / window.innerHeight;
          const halfHeight = Math.max(radius * 1.25, 0.001);
          const halfWidth = halfHeight * aspect;
          if (!camera.isOrthographicCamera) {
            const position = camera.position.clone();
            const target = controls.target.clone();
            replaceCamera(
              new THREE.OrthographicCamera(-halfWidth, halfWidth, halfHeight, -halfHeight, 0.001, 1000000),
              position,
              target
            );
          } else {
            camera.left = -halfWidth;
            camera.right = halfWidth;
            camera.top = halfHeight;
            camera.bottom = -halfHeight;
            camera.updateProjectionMatrix();
          }
        }

        function setProjectionMode(useParallel) {
          const m = getModelMetrics();
          const position = camera.position.clone();
          const target = controls.target.clone();
          const direction = position.clone().sub(target);
          if (direction.lengthSq() < 1e-12) direction.set(1, 1, 1);
          direction.normalize();

          parallelMode = useParallel;
          if (parallelMode) {
            ensureOrthographicCamera(m.radius);
          } else {
            ensurePerspectiveCamera(45);
            const dist = distanceToFrame(m.radius, camera.fov);
            camera.position.copy(target).add(direction.multiplyScalar(dist));
            camera.lookAt(target);
            controls.update();
          }
          updateClipFromModel();

          const button = document.getElementById('btnProjection');
          button.textContent = parallelMode ? 'Perspective view' : 'Parallel view';
          button.classList.toggle('active', parallelMode);
        }

        function distanceToFrame(radius, fovDeg) {
          const fov = THREE.MathUtils.degToRad(Math.max(10, Math.min(120, fovDeg || 45)));
          return (radius / Math.sin(fov * 0.5)) * 1.22;
        }

        let defaultViewDirection = new THREE.Vector3(1, 1, 1).normalize();
        let defaultOrbitCenter = null;

        function applyDefaultModelCamera() {
          const m = getModelMetrics();
          defaultOrbitCenter = m.center.clone();
          fitView(defaultViewDirection, defaultOrbitCenter);
        }

        function fitView(direction = null, forcedCenter = null) {
          const m = getModelMetrics();
          const center = forcedCenter ? forcedCenter.clone() : (defaultOrbitCenter ? defaultOrbitCenter.clone() : m.center.clone());
          let dir = direction ? direction.clone() : defaultViewDirection.clone();
          if (!isFinite(dir.x) || dir.lengthSq() < 1e-12) dir = new THREE.Vector3(1, 1, 1);
          dir.normalize();
          let dist;
          if (parallelMode) {
            ensureOrthographicCamera(m.radius);
            dist = Math.max(m.radius * 3, 10);
          } else {
            ensurePerspectiveCamera(45);
            dist = distanceToFrame(m.radius, camera.fov);
          }
          // Caméra volontairement placée en X+, Y+, Z+ par rapport au centre du modèle.
          camera.position.copy(center).add(dir.multiplyScalar(dist));
          controls.target.copy(center);
          controls.minDistance = Math.max(m.radius * 0.02, 0.001);
          controls.maxDistance = Math.max(m.radius * 100, dist * 20);
          updateClipFromModel();
          camera.lookAt(center);
          controls.update();
        }

        function setObjectOpacityRecursive(obj, opacity) {
          obj.traverse(child => {
            if (!child.material) return;

            if (!child.userData.__fgidOriginalMaterials) {
              const originals = Array.isArray(child.material) ? child.material : [child.material];
              child.userData.__fgidOriginalMaterials = originals.map(mat => ({
                transparent: mat.transparent,
                opacity: mat.opacity,
                depthWrite: mat.depthWrite
              }));
            }

            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((mat, index) => {
              if (!mat.userData.__fgidTriStateClone) {
                mat = mat.clone();
                mat.userData.__fgidTriStateClone = true;
                if (Array.isArray(child.material)) {
                  child.material[index] = mat;
                } else {
                  child.material = mat;
                }
              }

              const original = child.userData.__fgidOriginalMaterials[index] || {
                transparent: false,
                opacity: 1.0,
                depthWrite: true
              };

              if (opacity >= 0.999) {
                mat.transparent = original.transparent;
                mat.opacity = original.opacity;
                mat.depthWrite = original.depthWrite;
              } else {
                mat.transparent = true;
                mat.opacity = opacity;
                mat.depthWrite = false;
              }
              mat.needsUpdate = true;
            });
          });
        }

        const tagStates = new Map(Object.entries(FGID_META.layers).map(([k,v])=>[k,v.visible?0:2]));
        let selectedScene = 0;

        function applyTagStates() {
          // Tag opacity is always computed on the source material before view styling.
          if (root) root.traverse(object => {
            if (!object.isMesh) return;
            if (!renderSources.has(object)) renderSources.set(object, object.material);
            object.material = renderSources.get(object);
            if (!sceneBaseMaterials.has(object)) sceneBaseMaterials.set(object, object.material);
          });
          for(const top of [root,...annotationRoots]) if(top)top.traverse(o=>{
            const tags=o.userData.fgid_tags;
            const mask=o.userData.fgid_hidden_in;
            const hidden=mask?.includes(selectedScene) || false;
            if(mask) o.visible=!hidden;
            if(!tags || !tags.length)return;
            const states=tags.map(t=>tagStates.get(t)||0);
            o.visible=!hidden && !states.includes(2);
            const opacity=states.includes(1)?0.5:1;
            o.userData.__fgidTagState=states.includes(2)?2:states.includes(1)?1:0;
            o.traverse(c=>{
              if(!c.material)return;
              for(const m of (Array.isArray(c.material)?c.material:[c.material])){
                if(m.userData.fgidOpacity===undefined)m.userData.fgidOpacity=m.opacity;
                m.opacity=m.userData.fgidOpacity*opacity;m.transparent=m.opacity<1;m.depthWrite=m.opacity>=1;m.needsUpdate=true;
              }
            });
          });
          applyRenderMode();
          annotationOcclusionDirty=true;
        }
        function setTagState(tag,state){tagStates.set(tag,state);applyTagStates();}

        function buildTree() {
          const tree = document.getElementById('tree');
          tree.innerHTML = '';
          if (!root) return;

          const grouped = new Map();

          const collectTagObject = obj => {
            const tags=obj.userData.fgid_tags || (obj.userData.__fgidTopLevelRoot?[obj.userData.__fgidTopLevelTag||'Layer 0']:[]);
            for(const tag of tags){if(!grouped.has(tag))grouped.set(tag,[]);grouped.get(tag).push(obj);}
          };
          root.traverse(collectTagObject);
          annotationRoots.forEach(collectTagObject);

          if (grouped.size === 0) {
            const fallback = (root.children || []).filter(c => c.name !== '__edges_30deg__');
            if (fallback.length) grouped.set('Untagged', fallback);
          }

          const rootUl = document.createElement('ul');

          const tags = Array.from(grouped.keys()).sort((a, b) =>
            a.localeCompare(b, undefined, { sensitivity: 'base' })
          );

          tags.forEach(tag => {
            const objects = grouped.get(tag);

            const li = document.createElement('li');
            const row = document.createElement('div');
            row.className = 'tree-row';

            const eye = document.createElement('button');
            eye.type = 'button';
            eye.className = 'eye';

            const refreshEye = () => {
              const state = (tagStates.get(tag)||0);
              if (state === 0) {
                eye.textContent = '👁';
                eye.title = `Make tag ${tag} transparent`;
                eye.classList.remove('hidden');
                eye.style.opacity = '1';
              } else if (state === 1) {
                eye.textContent = '◉';
                eye.title = `Hide tag ${tag}`;
                eye.classList.remove('hidden');
                eye.style.opacity = '0.55';
              } else {
                eye.textContent = '◌';
                eye.title = `Show tag ${tag}`;
                eye.classList.add('hidden');
                eye.style.opacity = '0.38';
              }
            };

            eye.onclick = ev => {
              ev.stopPropagation();
              const current = (tagStates.get(tag)||0);
              const next = (current + 1) % 3;
              setTagState(tag, next);
              refreshEye();
            };

            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = tag;
            label.title = tag;

            row.appendChild(eye);
            row.appendChild(label);
            li.appendChild(row);
            rootUl.appendChild(li);

            refreshEye();
          });

          if (pointCloud) {
            const cloudLi = document.createElement('li');
            const cloudRow = document.createElement('div');
            cloudRow.className = 'tree-row';

            const cloudEye = document.createElement('button');
            cloudEye.type = 'button';
            cloudEye.className = 'eye';
            cloudEye.textContent = pointCloud.visible ? '👁' : '◌';
            cloudEye.title = pointCloud.visible ? 'Hide point cloud' : 'Show point cloud';
            cloudEye.classList.toggle('hidden', !pointCloud.visible);

            cloudEye.onclick = ev => {
              ev.stopPropagation();
              setPointCloudVisible(!pointCloud.visible);
              cloudEye.textContent = pointCloud.visible ? '👁' : '◌';
              cloudEye.title = pointCloud.visible ? 'Hide point cloud' : 'Show point cloud';
              cloudEye.classList.toggle('hidden', !pointCloud.visible);
            };

            const cloudLabel = document.createElement('span');
            cloudLabel.className = 'tree-label';
            cloudLabel.textContent = pointCloud.name || 'Point Cloud';
            cloudLabel.title = cloudLabel.textContent;

            cloudRow.appendChild(cloudEye);
            cloudRow.appendChild(cloudLabel);
            cloudLi.appendChild(cloudRow);
            rootUl.appendChild(cloudLi);
          }

          tree.appendChild(rootUl);
        }

        function selectObject(obj) {
          if (selected && selected.material && selected.userData.__oldEmissive) {
            const mats = Array.isArray(selected.material) ? selected.material : [selected.material];
            mats.forEach((m, i) => { if (m.emissive) m.emissive.copy(selected.userData.__oldEmissive[i]); });
          }
          selected = obj.isMesh ? obj : null;
          if (!selected) obj.traverse(c => { if (!selected && c.isMesh) selected = c; });
          if (selected && selected.material) {
            const mats = Array.isArray(selected.material) ? selected.material : [selected.material];
            selected.userData.__oldEmissive = mats.map(m => m.emissive ? m.emissive.clone() : new THREE.Color(0x000000));
            mats.forEach(m => { if (m.emissive) m.emissive.setHex(0x224466); });
          }
        }

        function focusLeaderAnnotation(annotation) {
          if (!annotation || !Array.isArray(annotation.anchor) || !Array.isArray(annotation.text_position)) return;
          const anchor = new THREE.Vector3().fromArray(annotation.anchor);
          const textPos = new THREE.Vector3().fromArray(annotation.text_position);
          const center = anchor.clone().add(textPos).multiplyScalar(0.5);
          const span = Math.max(anchor.distanceTo(textPos), 0.001);
          const modelMetrics = getModelMetrics();
          const focusRadius = Math.max(span * 0.70, modelMetrics.radius * 0.018, 0.10);

          let dir = camera.position.clone().sub(controls.target);
          if (!isFinite(dir.x) || dir.lengthSq() < 1e-12) dir.set(1, 1, 1);
          dir.normalize();

          let distance;
          if (parallelMode) {
            ensureOrthographicCamera(focusRadius);
            distance = Math.max(focusRadius * 3.0, 1.0);
          } else {
            ensurePerspectiveCamera(camera.isPerspectiveCamera ? camera.fov : 45);
            distance = distanceToFrame(focusRadius, camera.fov);
          }

          camera.position.copy(center).add(dir.multiplyScalar(distance));
          controls.target.copy(center);
          controls.minDistance = Math.max(focusRadius * 0.02, 0.001);
          controls.maxDistance = Math.max(modelMetrics.radius * 100, distance * 20);
          camera.near = Math.max(focusRadius / 1000, 0.001);
          camera.far = Math.max(modelMetrics.radius * 100, distance * 20, 100);
          camera.lookAt(center);
          camera.updateProjectionMatrix();
          controls.update();
          annotationOcclusionDirty = true;
        }

        function buildAnnotationsPanel() {
          const panel = document.getElementById('annotationsPanel');
          panel.innerHTML = '';
          const title = document.createElement('div');
          title.className = 'ann-title';
          title.textContent = 'Annotations';
          panel.appendChild(title);

          const leaders = (ANNOTATIONS || []).filter(a => a && (a.type === 'text' || a.type === 'dimension_linear'));
          if (!leaders.length) {
            const empty = document.createElement('div');
            empty.className = 'ann-empty';
            empty.textContent = 'No annotations';
            panel.appendChild(empty);
            return;
          }

          leaders.forEach((annotation, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'ann-item';
            const clean = String(annotation.text || '').replace(/\s+/g, ' ').trim();
            button.textContent = clean || `Leader ${index + 1}`;
            button.title = clean || `Leader ${index + 1}`;
            button.addEventListener('click', () => focusLeaderAnnotation(annotation));
            panel.appendChild(button);
          });
        }

        let sceneCutMaterials = [];
        const cutContours = [];

        function addCutContour(mesh, worldPlane, otherPlanes) {
          const geometry = mesh.geometry;
          const position = geometry.getAttribute('position');
          if (!position) return;
          const plane = worldPlane.clone().applyMatrix4(mesh.matrixWorld.clone().invert());
          if (!geometry.boundingBox) geometry.computeBoundingBox();
          if (!geometry.boundingBox.intersectsPlane(plane)) return;

          const index = geometry.getIndex();
          const count = index ? index.count : position.count;
          const vertices = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
          const distances = [0, 0, 0];
          const endpoints = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
          const segments = [];
          const epsilon = 1e-7;
          for (let i = 0; i + 2 < count; i += 3) {
            for (let j = 0; j < 3; j++) {
              vertices[j].fromBufferAttribute(position, index ? index.getX(i+j) : i+j);
              const distance = plane.distanceToPoint(vertices[j]);
              distances[j] = Math.abs(distance) <= epsilon ? 0 : distance;
            }
            if (distances.every(d => d === 0) || distances.every(d => d > 0) ||
                distances.every(d => d < 0)) continue;
            let hits = 0;
            for (let j = 0; j < 3; j++) {
              const k = (j + 1) % 3;
              const a = distances[j], b = distances[k];
              if (a === 0) endpoints[hits++].copy(vertices[j]);
              else if (a * b < 0) endpoints[hits++].lerpVectors(vertices[j], vertices[k], a / (a-b));
            }
            if (hits === 2 && endpoints[0].distanceToSquared(endpoints[1]) > epsilon ** 2) {
              for (let j = 0; j < 2; j++) {
                segments.push(endpoints[j].x, endpoints[j].y, endpoints[j].z);
              }
            }
          }
          if (!segments.length) return;
          const contourGeometry = new THREE.BufferGeometry();
          contourGeometry.setAttribute('position', new THREE.Float32BufferAttribute(segments, 3));
          const material = new THREE.LineBasicMaterial({
            color: 0xff1717, toneMapped: false, depthWrite: false, clippingPlanes: otherPlanes
          });
          const contour = new THREE.LineSegments(contourGeometry, material);
          contour.renderOrder = 3;
          mesh.add(contour);
          cutContours.push(contour);
        }

        const sceneBaseMaterials = new WeakMap();
        function applySceneCuts(cuts) {
          for (const contour of cutContours) {
            contour.removeFromParent();
            contour.geometry.dispose();
            contour.material.dispose();
          }
          cutContours.length = 0;
          renderer.localClippingEnabled = true;
          root.updateMatrixWorld(true);
          const scopes = new Map();
          const global = [];
          const byContext = new Map();
          for (const cut of cuts) {
            const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(
              new THREE.Vector3().fromArray(cut.normal).negate(),
              new THREE.Vector3().fromArray(cut.point)
            );
            if (!cut.context) global.push(plane);
            else {
              if (!byContext.has(cut.context)) byContext.set(cut.context, []);
              byContext.get(cut.context).push(plane);
            }
          }
          root.traverse(object => {
            const {fgid_scope: uid, fgid_context: context} = object.userData;
            if (uid != null) scopes.set(uid, object);
            object.userData.scenePlanes = (byContext.get(context) || []).map(
              plane => plane.clone().applyMatrix4(object.matrixWorld)
            );
          });
          const previousMaterials = sceneCutMaterials;
          sceneCutMaterials = [];
          const materialCache = new Map();
          const contourSources = [];
          root.traverse(object => {
            if (!object.material) return;
            const local = [];
            let owner = scopes.get(object.userData.fgid_owner) || object;
            while (owner && owner !== root) {
              if (owner.userData.scenePlanes?.length) local.push(...owner.userData.scenePlanes);
              owner = owner.parent;
            }
            const planes = [...global, ...local];
            if (object.isMesh && planes.length) contourSources.push([object, planes]);
            if (!sceneBaseMaterials.has(object)) sceneBaseMaterials.set(object, object.material);
            const source = sceneBaseMaterials.get(object);
            if (!planes.length) object.material = source;
            else {
              const key = source.uuid + JSON.stringify(planes.map(p => [...p.normal.toArray(), p.constant]));
              if (!materialCache.has(key)) {
                const clipped = source.clone();
                clipped.clippingPlanes = planes;
                materialCache.set(key, clipped);
                sceneCutMaterials.push(clipped);
              }
              object.material = materialCache.get(key);
            }
          });
          previousMaterials.forEach(material => material.dispose());
          for (const [mesh, planes] of contourSources) {
            planes.forEach((plane, index) => addCutContour(mesh, plane, planes.filter((_, i) => i !== index)));
          }
          clearRenderVariants();
          root.traverse(object => {
            if (object.isMesh) renderSources.set(object, object.material);
          });
          applyTagStates();
        }

        const toolbar = document.getElementById('toolbar');
        const toolbarToggle = document.getElementById('toolbarToggle');
        const toolbarGrip = document.getElementById('toolbarGrip');
        const compactToolbar = matchMedia('(max-width: 700px), (max-height: 480px)');
        const viewerPanels = [
          ['tree', 'btnTree'], ['annotationsPanel', 'btnAnnotations'],
          ['scenesPanel', 'btnScenes'], ['settings', 'btnSettings']
        ].map(([id, button]) => [document.getElementById(id), document.getElementById(button)]);
        let openViewerPanel = null;
        let toolbarDrag = null;

        function layoutViewerPanel() {
          if (!openViewerPanel) return;
          const rect = toolbar.getBoundingClientRect();
          const below = innerHeight - rect.bottom - 24;
          const above = rect.top - 24;
          const placeAbove = below < 160 && above > below;
          const panel = openViewerPanel;
          panel.style.top = placeAbove ? 'auto' : Math.min(rect.bottom + 8, innerHeight - 44) + 'px';
          panel.style.bottom = placeAbove ? (innerHeight - rect.top + 8) + 'px' : 'auto';
          panel.style.maxHeight = Math.max(32, placeAbove ? above : below) + 'px';
        }

        function toggleViewerPanel(panelId) {
          const next = document.getElementById(panelId);
          openViewerPanel = next === openViewerPanel ? null : next;
          for (const [panel, button] of viewerPanels) {
            const open = panel === openViewerPanel;
            panel.style.display = open ? 'block' : 'none';
            button.classList.toggle('active', open);
            button.setAttribute('aria-expanded', String(open));
          }
          layoutViewerPanel();
        }

        function positionToolbar(left, top) {
          const rect = toolbar.getBoundingClientRect();
          toolbar.style.left = Math.max(12, Math.min(left, innerWidth - rect.width - 12)) + 'px';
          toolbar.style.top = Math.max(12, Math.min(top, innerHeight - rect.height - 12)) + 'px';
          layoutViewerPanel();
        }

        function fitToolbar() {
          if (compactToolbar.matches) {
            const rect = toolbar.getBoundingClientRect();
            positionToolbar(rect.left, rect.top);
          } else {
            toolbar.style.left = '';
            toolbar.style.top = '';
            layoutViewerPanel();
          }
        }

        toolbarToggle.onclick = () => {
          const collapsed = toolbar.classList.toggle('collapsed');
          toolbarToggle.setAttribute('aria-expanded', String(!collapsed));
          if (collapsed && openViewerPanel) toggleViewerPanel(null);
          fitToolbar();
        };
        toolbarGrip.addEventListener('pointerdown', event => {
          if (toolbarDrag || event.button !== 0) return;
          const rect = toolbar.getBoundingClientRect();
          toolbarDrag = { id: event.pointerId, x: event.clientX - rect.left, y: event.clientY - rect.top };
          toolbarGrip.setPointerCapture(event.pointerId);
          event.preventDefault();
        });
        toolbarGrip.addEventListener('pointermove', event => {
          if (toolbarDrag?.id === event.pointerId) {
            positionToolbar(event.clientX - toolbarDrag.x, event.clientY - toolbarDrag.y);
          }
        });
        toolbarGrip.addEventListener('lostpointercapture', () => { toolbarDrag = null; });
        window.addEventListener('resize', fitToolbar);
        new ResizeObserver(fitToolbar).observe(toolbar);

        document.addEventListener('pointerdown', event => {
          if (!openViewerPanel || openViewerPanel.contains(event.target) ||
              toolbarGrip.contains(event.target) || toolbarToggle.contains(event.target) ||
              viewerPanels.some(([, button]) => button.contains(event.target))) return;
          toggleViewerPanel(null);
          if (event.target === renderer.domElement) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
        document.addEventListener('keydown', event => {
          if (event.key === 'Escape' && openViewerPanel) toggleViewerPanel(null);
        });

        let sceneFlight = null;
        function cancelSceneFlight() {
          if (!sceneFlight) return;
          controls.autoRotate = sceneFlight.spin;
          sceneFlight = null;
        }
        renderer.domElement.addEventListener('pointerdown', cancelSceneFlight, true);
        renderer.domElement.addEventListener('wheel', cancelSceneFlight, true);
        toolbar.addEventListener('click', cancelSceneFlight, true);

        function advanceSceneFlight(now) {
          if (!sceneFlight) return;
          const flight = sceneFlight;
          const time = THREE.MathUtils.clamp((now - flight.start) / 2000, 0, 1);
          const blend = time * time * (3 - 2 * time);
          // Move the eye directly. A saved orbit pivot is only used for navigation.
          camera.position.lerpVectors(flight.fromEye, flight.eye, blend);
          camera.quaternion.slerpQuaternions(flight.fromOrientation, flight.orientation, blend);
          controls.target.set(0, 0, -THREE.MathUtils.lerp(flight.fromDistance, flight.distance, blend))
            .applyQuaternion(camera.quaternion).add(camera.position);
          annotationOcclusionDirty = true;
          if (time === 1) {
            controls.target.copy(flight.target);
            cancelSceneFlight();
          }
        }

        function setupScenes() {
          const records = FGID_META.scenes;
          if (!records.length) return;
          const button = document.getElementById('btnScenes');
          const panel = document.getElementById('scenesPanel');
          const items = records.map((record, index) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.textContent = record.name;
            item.title = record.name;
            item.onclick = () => recall(index);
            return item;
          });
          for (const index of FGID_META.sceneMenuOrder) panel.appendChild(items[index]);
          const initialCamera = {
            eye: camera.position.toArray(), target: controls.target.toArray(),
            up: camera.up.toArray(), fov: camera.fov, parallel: false
          };
          function recall(index, animateCamera = true, moveCamera = true) {
            selectedScene = index;
            items.forEach((item, itemIndex) => {
              item.classList.toggle('active', index === itemIndex);
              item.setAttribute('aria-pressed', String(index === itemIndex));
            });
            const record = records[index];
            if (!index || record.hiddenLayers) {
              const hidden = new Set(record.hiddenLayers);
              for (const [name, layer] of Object.entries(FGID_META.layers)) {
                tagStates.set(name, (index ? hidden.has(name) : !layer.visible) ? 2 : 0);
              }
            }
            applyTagStates();
            if (record.cloud) applyPointCloudScene(record.cloud);
            buildTree();
            if (record.cuts) applySceneCuts(record.cuts);
            if (!index) setTheme(DARK_DEFAULT);
            if (record.background) {
              scene.background.setRGB(...record.background, THREE.SRGBColorSpace);
            }
            if (!index || typeof record.edges === 'boolean') {
              setEdgesVisible(index ? record.edges : EDGES_DEFAULT);
            }
            const view = index ? record.camera : record.camera || initialCamera;
            if (!view || !moveCamera) return;
            cancelSceneFlight();
            const fromEye = camera.position.clone();
            const fromTarget = controls.target.clone();
            const fromOrientation = camera.quaternion.clone();
            const eye = new THREE.Vector3().fromArray(view.eye);
            const target = new THREE.Vector3().fromArray(view.target);
            parallelMode = view.parallel;
            if (parallelMode) {
              ensureOrthographicCamera(view.halfHeight / 1.25);
              camera.zoom = 1;
            } else {
              ensurePerspectiveCamera(view.fov);
            }
            camera.up.fromArray(view.up);
            // OrbitControls caches the camera's up direction at construction.
            const spin = controls.autoRotate;
            controls.dispose();
            controls = new OrbitControls(camera, renderer.domElement);
            configureControls();
            controls.autoRotate = false;
            controls.target.copy(target);
            camera.position.copy(eye);
            controls.maxDistance = Math.max(controls.maxDistance, eye.distanceTo(target) * 2);
            camera.lookAt(target);
            updateClipFromModel();
            camera.far = Math.max(camera.far, eye.distanceTo(target) * 2);
            camera.updateProjectionMatrix();
            controls.update();
            if (spin) {
              const rect = renderer.domElement.getBoundingClientRect();
              controls.orbitPivot = pickOrbitPivot(rect.left + rect.width / 2, rect.top + rect.height / 2);
            }
            controls.autoRotate = spin;
            const fromDistance = fromEye.distanceTo(fromTarget);
            const distance = eye.distanceTo(target);
            const orientation = camera.quaternion.clone();
            if (animateCamera && !matchMedia('(prefers-reduced-motion: reduce)').matches &&
                fromDistance > 1e-6 && distance > 1e-6 &&
                (fromEye.distanceToSquared(eye) > 1e-12 || fromOrientation.angleTo(orientation) > 1e-6)) {
              sceneFlight = {
                start: performance.now(), spin, fromEye, eye, target, fromOrientation, orientation,
                fromDistance, distance
              };
              controls.autoRotate = false;
              advanceSceneFlight(sceneFlight.start);
            }
            const projection = document.getElementById('btnProjection');
            projection.textContent = parallelMode ? 'Perspective view' : 'Parallel view';
            projection.classList.toggle('active', parallelMode);
          }
          button.onclick = () => toggleViewerPanel('scenesPanel');
          button.hidden = false;
          const order = FGID_META.sceneMenuOrder;
          const defaultScene = order.includes(0) ? 0 : order[0];
          recall(0, false);
          if (defaultScene !== 0) {
            recall(defaultScene, false);
            document.getElementById('btnDefaultView').onclick = () => {
              recall(0, false, false);
              recall(defaultScene);
            };
          }
        }

        function loadModel(glb) {
            root = parseEmbeddedGLB(glb);
            root.name = root.name || '@@escape_js(title)@@';
            cleanSpecialNodeNames(root);
            normalizeMaterials(root);
            scene.add(root);
            modelOccluders=[];
            root.traverse(c=>{ if(c.isMesh) modelOccluders.push(c); });
            buildAnnotations();
            buildAnnotationsPanel();
            annotationOcclusionDirty=true;
            loadEmbeddedPointCloud();
            configureCloudScenes();
            for(const e of FGID_META.loose){
              const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(e.positions,3));
              const tag=e.tags[e.tags.length-1];const col=FGID_META.layers[tag]?.color;
              const m=new THREE.LineBasicMaterial({color:FGID_META.looseMode==='Tags'&&col?new THREE.Color(...col):(DARK_DEFAULT?0xffffff:0x000000)});
              const o=new THREE.LineSegments(g,m);o.userData.fgid_tags=e.tags;o.userData.fgid_hidden_in=e.hiddenIn;o.userData.fgid_owner=e.scope;o.userData.fgidLoose=true;root.add(o);
            }
            addEdges(root);
            setEdgesVisible(EDGES_DEFAULT);
            document.getElementById('chkEdgesDefault').checked = EDGES_DEFAULT;
            applyTagStates();
            document.getElementById('status').textContent=`${modelOccluders.length} meshes · ${Object.keys(FGID_META.layers).length} Tags`;
            buildTree();
            applyDefaultModelCamera();
            setupScenes();
          setEdgesVisible(EDGES_DEFAULT);
        }

        document.getElementById('renderMode').onchange = event => {
          renderMode = event.currentTarget.value;
          applyRenderMode();
        };
        document.getElementById('btnEdges').onclick = () => setEdgesVisible(!edgesVisible);
        document.getElementById('btnSpin').onclick = e => { controls.autoRotate = !controls.autoRotate;
          if (controls.autoRotate) {
            const rect = renderer.domElement.getBoundingClientRect();
            controls.orbitPivot = pickOrbitPivot(rect.left + rect.width / 2, rect.top + rect.height / 2);
          }
          controls.autoRotateSpeed = 2.0; e.currentTarget.classList.toggle('active', controls.autoRotate); };
        document.getElementById('btnTree').onclick = () => toggleViewerPanel('tree');
        document.getElementById('btnAnnotations').onclick = () => toggleViewerPanel('annotationsPanel');
        document.getElementById('btnPointCloud').onclick = () => {
          if (pointCloud) setPointCloudVisible(!pointCloud.visible);
        };
        function setTheme(isDark) {
          if(root)root.traverse(o=>{if(o.userData.fgidLoose && FGID_META.looseMode!=='Tags')o.material.color.set(isDark?0xffffff:0x000000);});
          darkMode = isDark;
          document.body.classList.toggle('dark', darkMode);
          scene.background.setHex(darkMode ? DARK_BACKGROUND : LIGHT_BACKGROUND);

          // White edges in dark mode, black edges in light mode.
          const edgeColor = darkMode ? 0xffffff : 0x111111;
          edgeObjects.forEach(edges => {
            if (edges.material && edges.material.color) {
              edges.material.color.setHex(edgeColor);
              edges.material.needsUpdate = true;
            }
          });

          const button = document.getElementById('btnTheme');
          button.textContent = darkMode ? 'Light mode' : 'Dark mode';
          button.classList.toggle('active', darkMode);
          applyRenderMode();
        }

        document.getElementById('btnTheme').onclick = () => setTheme(!darkMode);
        document.getElementById('btnProjection').onclick = () => setProjectionMode(!parallelMode);
        document.getElementById('btnSettings').onclick = () => toggleViewerPanel('settings');
        document.getElementById('chkEdgesDefault').onchange = e => setEdgesVisible(e.currentTarget.checked);
        document.getElementById('plyPointSize').onchange = e => {
          if (!pointCloud || !pointCloud.material) return;
          const size = FGID_META.cloud
            ? Math.max(1, Math.min(12, Number(e.currentTarget.value) || 2))
            : Math.max(0.0005, Math.min(1.0, Number(e.currentTarget.value) || Number(PLY_POINT_SIZE_DEFAULT) || 0.015));
          e.currentTarget.value = size;
          pointCloud.material.size = size;
          pointCloud.material.needsUpdate = true;
        };
        ['plyTx','plyTy','plyTz','plyRx','plyRy','plyRz','plyScale'].forEach(id => {
          document.getElementById(id).oninput = applyExtraPointCloudTransform;
        });
        document.getElementById('btnResetPlyTransform').onclick = () => {
          ['plyTx','plyTy','plyTz','plyRx','plyRy','plyRz'].forEach(id => document.getElementById(id).value = 0);
          document.getElementById('plyScale').value = 1;
          applyExtraPointCloudTransform();
        };
        document.getElementById('btnDefaultView').onclick = () => applyDefaultModelCamera();
        document.getElementById('btnIso').onclick = () => fitView(new THREE.Vector3(1, 1, 1));
        document.getElementById('btnFront').onclick = () => fitView(new THREE.Vector3(0, 0, 1));
        for(const [id,v] of Object.entries({btnBottom:[0,-1,0],btnBack:[0,0,-1],btnLeft:[-1,0,0],btnRight:[1,0,0]}))document.getElementById(id).onclick=()=>fitView(new THREE.Vector3(...v));
        document.getElementById('btnTop').onclick = () => fitView(new THREE.Vector3(0, 1, 0));
        document.getElementById('btnFit').onclick = () => fitView();

        function hitIsVisible(hit) {
          for (let object = hit.object; object; object = object.parent) {
            if (!object.visible) return false;
          }
          return !(hit.object.material.clippingPlanes || []).some(
            plane => plane.distanceToPoint(hit.point) < -1e-6
          );
        }

        renderer.domElement.addEventListener('dblclick', event => {
          if (!root) return;
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const meshes = []; root.traverse(c => { if (c.isMesh) meshes.push(c); });
          const hits = raycaster.intersectObjects(meshes, true);
          const hit = hits.find(hitIsVisible);
          if (hit) selectObject(hit.object);
        });


        window.addEventListener('resize', () => {
          const aspect = window.innerWidth / window.innerHeight;
          if (camera.isPerspectiveCamera) {
            camera.aspect = aspect;
          } else if (camera.isOrthographicCamera) {
            const halfHeight = Math.max((camera.top - camera.bottom) * 0.5, 0.001);
            camera.left = -halfHeight * aspect;
            camera.right = halfHeight * aspect;
          }
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          annotationOcclusionDirty = true;
        });

        function animate(now = performance.now()) {
          requestAnimationFrame(animate);
          if (sceneFlight) advanceSceneFlight(now);
          else controls.update();
          if(annotationOcclusionDirty) updateAnnotationOcclusion();
          renderer.render(scene, camera);
        }
        setTheme(DARK_DEFAULT);
        const loading = document.getElementById('loading');
        function progress(percent, message) {
          document.getElementById('loading-ring').setAttribute('aria-valuenow', percent);
          document.getElementById('loading-percent').textContent = percent + ' %';
          document.getElementById('loading-progress').style.strokeDashoffset = 100 - percent;
          if (message) document.getElementById('loading-message').textContent = message;
        }

        // Let the browser paint the progress screen before CPU-heavy steps.
        const paintProgress = () => new Promise(resolve =>
          requestAnimationFrame(() => requestAnimationFrame(resolve))
        );

        async function readModel() {
          if (!('DecompressionStream' in window)) {
            throw new Error('Ce navigateur ne prend pas en charge la décompression gzip.');
          }
          const stream = new Blob([b64ToArrayBuffer(EMBEDDED_GLB_BASE64)]).stream()
            .pipeThrough(new DecompressionStream('gzip'));
          const reader = stream.getReader();
          const result = new Uint8Array(GLB_BYTES);
          let offset = 0;
          let displayed = 0;
          for (;;) {
            const {done, value} = await reader.read();
            if (done) break;
            result.set(value, offset);
            offset += value.byteLength;
            const percent = Math.floor(90 * offset / GLB_BYTES);
            if (percent >= displayed + 5) {
              progress(percent);
              displayed = percent;
            }
          }
          if (offset !== GLB_BYTES) throw new Error('Les données du modèle sont incomplètes.');
          return result.buffer;
        }

        async function startViewer() {
          await paintProgress();
          const glb = await readModel();
          progress(90, 'Préparation du modèle…');
          await paintProgress();
          loadModel(glb);
          progress(98, 'Premier affichage…');
          await paintProgress();
          animate();
          progress(100);
          loading.hidden = true;
        const gpuExt=renderer.getContext().getExtension('WEBGL_debug_renderer_info');
        document.getElementById('status').title=gpuExt?renderer.getContext().getParameter(gpuExt.UNMASKED_RENDERER_WEBGL):'WebGL renderer';
        window.HTML3D_DIAGNOSTICS={meshes:modelOccluders.length,triangles:renderer.info.render.triangles,tags:[...tagStates.keys()],offline:true};
        }

        startViewer().catch(error => {
          console.error(error);
          document.getElementById('loading-ring').hidden = true;
          document.getElementById('loading-message').textContent =
            'Impossible de charger le modèle. ' + error.message;
        });
      </script>
    </body>
    </html>
